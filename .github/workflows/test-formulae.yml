name: Test formulae

on:
  pull_request:
    paths: ["Formula/**", ".github/workflows/test-formulae.yml"]
  push:
    branches: [main]
    paths: ["Formula/**", ".github/workflows/test-formulae.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit, install, and test the checked-out formulae
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew tap --custom-remote hermes-labs-ai/tap "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            sources=()
            while IFS= read -r source; do
              sources+=("$source")
            done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'Formula/*.rb')
            if (( ${#sources[@]} == 0 )); then
              sources=(Formula/*.rb)
            fi
          else
            sources=(Formula/*.rb)
          fi
          for source in "${sources[@]}"; do
            name="$(basename "$source" .rb)"
            formula="hermes-labs-ai/tap/$name"
            if brew help trust >/dev/null 2>&1; then
              brew trust --formula "$formula"
            fi
            brew audit --strict "$formula"
            brew install --build-from-source "$formula"
            brew test "$formula"
          done
